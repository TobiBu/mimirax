name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: pydoclint (full package)
        run: pydoclint --config pyproject.toml mimirax/

      - name: flake8 (undefined names only)
        run: flake8 --select=F821,F822 --builtins=n,m,t,k,d .

      - name: pyright (static type check)
        run: pyright mimirax

      - name: Unit tests with coverage
        run: pytest

      - name: Runtime type-check smoke (jaxtyping + beartype)
        env:
          MIMIRAX_RUNTIME_TYPECHECK: "1"
        run: >-
          pytest -o addopts="" --no-header -q
          tests/unit/test_parameters.py
          tests/unit/test_testing_doubles.py
          tests/unit/test_observables_m2m.py
          tests/unit/test_m2m.py
          tests/unit/test_shooting.py
          tests/unit/test_parallel_segments.py
          tests/integration/test_recover_linear_truth.py

      - name: Build documentation
        run: |
          pip install -e ".[docs]"
          python -m sphinx -b html docs docs/_build/html

      - name: Upload coverage XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

  # The solver-backed tests (S10, user decision D-4). The job above installs no
  # solver, so every test that needs jaccpot or nornax is skipped there; this one
  # installs them from GitHub at PINNED commits and runs the multiple-shooting
  # tests on jaccpot's direct sum, on CPU, in float64. The fused-lane tests are not
  # run in CI (they are manual gates on an A100).
  #
  # PINS: the three mains (2026-11-03), after jaccpot #498 (the S10 follow-ups:
  # `GradientPlan.rollout(start_force=)`, `GradientPlan.arrays`), nornax #23
  # (`nornax.potentials`, `shooting_node` on a RebuildingForceModel) and yggdrax
  # #106. Bump the three together: jaccpot's `yggdrax>=0.0.1` and jax window
  # (>=0.11.2,<0.12) are what the resolver reconciles here.
  solver-tests:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      YGGDRAX_REF: ac875003282e9e95c4b9e4427c56ae0a2e834181
      JACCPOT_REF: 96122f6383b3254c350f08d61041143d1344c96a
      NORNAX_REF: dcf7796df86d28a6c0fb7e0a25e960d96d36bd05

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # jaccpot requires Python >= 3.12.
          python-version: "3.12"
          cache: pip

      - name: Install mimirax + the solvers at the pinned commits
        # One resolver run, so jaccpot's jax window and every package's floor are
        # reconciled together; yggdrax is named explicitly so jaccpot's
        # `yggdrax` requirement is met by the pinned commit, not by an index.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" \
            "yggdrax @ git+https://github.com/TobiBu/yggdrax.git@${YGGDRAX_REF}" \
            "jaccpot @ git+https://github.com/TobiBu/jaccpot.git@${JACCPOT_REF}" \
            "nornax @ git+https://github.com/TobiBu/nornax.git@${NORNAX_REF}"
          python -c "import jax, jaccpot, nornax, yggdrax; print('jax', jax.__version__)"

      - name: Multiple shooting on the direct sum (CPU)
        run: >-
          pytest -o addopts="" --no-header -q
          tests/unit/test_shooting.py
          tests/unit/test_parallel_segments.py
          tests/integration/test_multiple_shooting.py
          tests/integration/test_parallel_segments.py
          tests/integration/test_shooting_galaxy_potentials.py
          tests/integration/test_long_horizon_shooting.py

      - name: The same under runtime type-checking (jaxtyping + beartype)
        env:
          MIMIRAX_RUNTIME_TYPECHECK: "1"
          JACCPOT_RUNTIME_TYPECHECK: "1"
        run: >-
          pytest -o addopts="" --no-header -q
          tests/unit/test_shooting.py
          tests/unit/test_parallel_segments.py
          tests/integration/test_multiple_shooting.py
          tests/integration/test_parallel_segments.py
          tests/integration/test_shooting_galaxy_potentials.py
          tests/integration/test_long_horizon_shooting.py
